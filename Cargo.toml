[package]
name = "lurt"
version = "0.1.0"
edition = "2024"
description = "A light, fast, glass-styled web browser"

[dependencies]
adblock = "0.13"
base64 = "0.22"
dirs = "7.0.0"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.38"
ureq = "3.5.2"
url = "2.5.9"
webview2-com = "0.39"
window-vibrancy = "0.8"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
wry = { version = "0.58", features = ["devtools"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
