<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Lurt: two clear-glass bars crossing into an L, on a dark glass tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2230"/><stop offset="1" stop-color="#0e1219"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#tile)"/>
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#glow)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="25.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <g transform="translate(18 18) scale(.64)">
    <rect x="22" y="12" width="20" height="76" rx="10" fill="url(#body)" fill-opacity=".22"/>
    <rect x="22.5" y="12.5" width="19" height="75" rx="9.5" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    <rect x="22" y="68" width="62" height="20" rx="10" fill="url(#body)" fill-opacity=".2"/>
    <rect x="22.5" y="68.5" width="61" height="19" rx="9.5" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
  </g>
</svg>
